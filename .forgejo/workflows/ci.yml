name: "CI / CD Pipeline"

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  test:
    name: "Rust Test & Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Install Rust Toolchain"
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: "Format Check"
        run: cargo fmt -- --check
      - name: "Clippy (Zero Warnings)"
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: "Run Tests"
        run: cargo test --all-targets --all-features
      - name: "Audit CI Release Workflow"
        run: bash tests/test_ci_release_workflow.sh
      - name: "Audit CI Prune Release Asset"
        run: bash tests/test_ci_prune_release_asset.sh
      - name: "Audit CI Publish Crate Workflow"
        run: bash tests/test_ci_publish_crate.sh

  deploy-site:
    name: "Deploy Documentation Site"
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: "Deploy to Cloudflare Workers"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            npx wrangler deploy
          else
            echo "CLOUDFLARE_API_TOKEN not set, skipping Cloudflare deploy."
          fi

  release:
    name: "Release Linux x86_64 Binary"
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: "Install Rust Toolchain"
        uses: dtolnay/rust-toolchain@stable
      - name: "Configure Gambi Cargo Registry"
        env:
          GAMBI_TOKEN: ${{ secrets.GAMBI_2LP_IN_TOKEN }}
        run: |
          mkdir -p "$HOME/.cargo"
          printf '[registries.gambi]\nindex = "sparse+https://gambi.2lp.in/api/packages/lumen/cargo/"\n' > "$HOME/.cargo/config.toml"
          if [ -n "$GAMBI_TOKEN" ]; then
            printf '[registries.gambi]\ntoken = "%s"\n' "$GAMBI_TOKEN" > "$HOME/.cargo/credentials.toml"
          fi

      - name: "Publish Crate to Gambi Registry"
        env:
          GAMBI_TOKEN: ${{ secrets.GAMBI_2LP_IN_TOKEN }}
        run: |
          if [ -n "$GAMBI_TOKEN" ]; then
            CANONICAL_VERSION=$(head -n 1 VERSION | cut -d '-' -f1 | tr -d ' \r\n')
            echo "-> Sincronizando Cargo.toml para a versao canonica: $CANONICAL_VERSION"
            sed -i "0,/^version = .*/s//version = \"${CANONICAL_VERSION}\"/" Cargo.toml
            echo "-> Publicando urupema no registry gambi..."
            cargo publish --registry gambi --allow-dirty || echo "::warning::Versao ja publicada ou falha tolerada no registry."
          else
            echo "GAMBI_2LP_IN_TOKEN not set, skipping crate publish."
          fi

      - name: "Build Release Binary"
        run: cargo build --release --bin urupema

      - name: "Prune Previous Asset on Forgejo"
        env:
          GAMBI_TOKEN: ${{ secrets.GAMBI_2LP_IN_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -c '
          import os, sys, json, urllib.request

          api_url = os.environ.get("GITHUB_API_URL") or "https://gambi.2lp.in/api/v1"
          repo = os.environ.get("GITHUB_REPOSITORY") or "lumen/urupema"
          token = os.environ.get("GAMBI_TOKEN") or os.environ.get("GITHUB_TOKEN") or ""

          headers = {"User-Agent": "urupema-ci"}
          if token:
              headers["Authorization"] = f"token {token}"

          url = f"{api_url}/repos/{repo}/releases/tags/latest"
          req = urllib.request.Request(url, headers=headers)
          try:
              with urllib.request.urlopen(req) as resp:
                  rel = json.load(resp)
          except Exception as e:
              print(f"-> Nenhuma release previa encontrada ou erro na consulta: {e}")
              sys.exit(0)

          rel_id = rel.get("id")
          for asset in rel.get("assets", []):
              if asset.get("name") == "urupema":
                  asset_id = asset.get("id")
                  del_url = f"{api_url}/repos/{repo}/releases/{rel_id}/assets/{asset_id}"
                  del_req = urllib.request.Request(del_url, headers=headers, method="DELETE")
                  try:
                      with urllib.request.urlopen(del_req) as del_resp:
                          print(f"-> Asset antigo urupema (id: {asset_id}) removido da release {rel_id}: {del_resp.status}")
                  except Exception as e:
                      print(f"::warning::Falha ao podar asset {asset_id}: {e}")
          '

      - name: "Publish Release (latest)"
        uses: https://github.com/softprops/action-gh-release@v2
        with:
          tag_name: "latest"
          name: "Urupema Latest (linux-x86_64)"
          prerelease: false
          files: target/release/urupema
          body: |
            Binário oficial compilado para linux-x86_64.
            Commit: ${{ github.sha }}

