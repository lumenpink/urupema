name: "CI / CD Pipeline"

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  test:
    name: "Rust Test & Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Install Rust Toolchain"
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: "Format Check"
        run: cargo fmt -- --check
      - name: "Clippy (Zero Warnings)"
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: "Run Tests"
        run: cargo test --all-targets --all-features
      - name: "Audit CI Release Workflow"
        run: bash tests/test_ci_release_workflow.sh
      - name: "Audit CI Publish Crate Workflow"
        run: bash tests/test_ci_publish_crate.sh

  deploy-site:
    name: "Deploy Documentation Site"
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: "Deploy to Cloudflare Workers"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            npx wrangler deploy
          else
            echo "CLOUDFLARE_API_TOKEN not set, skipping Cloudflare deploy."
          fi

  release:
    name: "Release Linux x86_64 Binary"
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: "Install Rust Toolchain"
        uses: dtolnay/rust-toolchain@stable
      - name: "Configure Sovereign Gambi Cargo Registry"
        env:
          GAMBI_TOKEN: ${{ secrets.GAMBI_2LP_IN_TOKEN }}
        run: |
          mkdir -p "$HOME/.cargo"
          printf '[registries.gambi]\nindex = "sparse+https://gambi.2lp.in/api/packages/lumen/cargo/"\n' > "$HOME/.cargo/config.toml"
          if [ -n "$GAMBI_TOKEN" ]; then
            printf '[registries.gambi]\ntoken = "%s"\n' "$GAMBI_TOKEN" > "$HOME/.cargo/credentials.toml"
          fi

      - name: "Publish Crate to Sovereign Gambi Registry"
        env:
          GAMBI_TOKEN: ${{ secrets.GAMBI_2LP_IN_TOKEN }}
        run: |
          if [ -n "$GAMBI_TOKEN" ]; then
            CANONICAL_VERSION=$(head -n 1 VERSION | cut -d '-' -f1 | tr -d ' \r\n')
            echo "-> Sincronizando Cargo.toml para a versao canonica: $CANONICAL_VERSION"
            sed -i "0,/^version = .*/s//version = \"${CANONICAL_VERSION}\"/" Cargo.toml
            echo "-> Publicando urupema no registry gambi..."
            cargo publish --registry gambi --allow-dirty || echo "::warning::Versao ja publicada ou falha tolerada no registry."
          else
            echo "GAMBI_2LP_IN_TOKEN not set, skipping crate publish."
          fi

      - name: "Build Release Binary"
        run: cargo build --release --bin urupema

      - name: "Prune Previous Asset on Forgejo"
        run: |
          API_URL="${GITHUB_API_URL:-https://gambi.2lp.in/api/v1}"
          REPO="${GITHUB_REPOSITORY:-lumen/urupema}"
          TOKEN="${GITHUB_TOKEN:-${{ secrets.GITHUB_TOKEN }}}"
          REL_INFO=$(curl -s -H "Authorization: token $TOKEN" "$API_URL/repos/$REPO/releases/tags/latest" || true)
          REL_ID=$(echo "$REL_INFO" | jq -r .id 2>/dev/null || echo "")
          if [ -n "$REL_ID" ] && [ "$REL_ID" != "null" ]; then
            ASSET_ID=$(echo "$REL_INFO" | jq -r '.assets[]? | select(.name=="urupema") | .id' 2>/dev/null || echo "")
            if [ -n "$ASSET_ID" ] && [ "$ASSET_ID" != "null" ]; then
              curl -s -X DELETE -H "Authorization: token $TOKEN" "$API_URL/repos/$REPO/releases/$REL_ID/assets/$ASSET_ID" || true
            fi
          fi

      - name: "Publish Sovereign Release (latest)"
        uses: https://github.com/softprops/action-gh-release@v2
        with:
          tag_name: "latest"
          name: "Urupema Latest (linux-x86_64)"
          prerelease: false
          files: target/release/urupema
          body: |
            Binário soberano oficial compilado para linux-x86_64.
            Commit: ${{ github.sha }}

