name: "CI / CD Pipeline"

on:
  push:
    branches:
      - main
      - develop
    tags:
      - "v*"
  pull_request:

jobs:
  test:
    name: "Rust Test & Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Install Rust Toolchain"
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: "Format Check"
        run: cargo fmt -- --check
      - name: "Clippy (Zero Warnings)"
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: "Run Tests"
        run: cargo test --all-targets --all-features
      - name: "Audit CI Release Workflow"
        run: bash tests/test_ci_release_workflow.sh
      - name: "Audit CI Prune Release Asset"
        run: bash tests/test_ci_prune_release_asset.sh
      - name: "Audit CI Publish Crate Workflow"
        run: bash tests/test_ci_publish_crate.sh

  deploy-site:
    name: "Deploy Documentation Site"
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: "Deploy to Cloudflare Workers"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            npx wrangler deploy
          else
            echo "CLOUDFLARE_API_TOKEN not set, skipping Cloudflare deploy."
          fi

  release:
    name: "Release Linux x86_64 Binary"
    runs-on: ubuntu-latest
    needs: [test]
    if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: "Install Rust Toolchain"
        uses: dtolnay/rust-toolchain@stable

      - name: "Determine Version and Release Tags"
        id: versioning
        run: |
          RAW_VERSION=$(head -n 1 VERSION | tr -d ' \r\n')
          BASE_VERSION=$(echo "$RAW_VERSION" | cut -d'-' -f1 | cut -d'+' -f1)

          if [[ "$RAW_VERSION" == *"-dev"* ]] || [[ "${{ github.ref }}" != refs/tags/v* && "$RAW_VERSION" =~ [a-zA-Z] ]]; then
            IS_DEV=true
            CANONICAL_TAG="$RAW_VERSION"
            NAMED_GENERIC_TAG="${BASE_VERSION}-dev"
            PRIMARY_GENERIC_TAG="latest-dev"
          else
            IS_DEV=false
            CANONICAL_TAG="$RAW_VERSION"
            NAMED_GENERIC_TAG="${BASE_VERSION}"
            PRIMARY_GENERIC_TAG="latest"
          fi

          echo "is_dev=${IS_DEV}" >> "$GITHUB_OUTPUT"
          echo "canonical_tag=${CANONICAL_TAG}" >> "$GITHUB_OUTPUT"
          echo "named_generic_tag=${NAMED_GENERIC_TAG}" >> "$GITHUB_OUTPUT"
          echo "primary_generic_tag=${PRIMARY_GENERIC_TAG}" >> "$GITHUB_OUTPUT"

          echo "★ Versao Resolvida: $RAW_VERSION (dev=$IS_DEV)"
          echo "★ Tag Canonica    : $CANONICAL_TAG"
          echo "★ Tag Nomeada     : $NAMED_GENERIC_TAG"
          echo "★ Tag Principal   : $PRIMARY_GENERIC_TAG"

      - name: "Configure Gambi Cargo Registry"
        env:
          GAMBI_TOKEN: ${{ secrets.GAMBI_2LP_IN_TOKEN }}
        run: |
          mkdir -p "$HOME/.cargo"
          printf '[registries.gambi]\nindex = "sparse+https://gambi.2lp.in/api/packages/lumen/cargo/"\n' > "$HOME/.cargo/config.toml"
          if [ -n "$GAMBI_TOKEN" ]; then
            printf '[registries.gambi]\ntoken = "%s"\n' "$GAMBI_TOKEN" > "$HOME/.cargo/credentials.toml"
          fi

      - name: "Publish Crate to Gambi Registry"
        env:
          GAMBI_TOKEN: ${{ secrets.GAMBI_2LP_IN_TOKEN }}
        run: |
          if [ -n "$GAMBI_TOKEN" ]; then
            CANONICAL_VERSION="${{ steps.versioning.outputs.canonical_tag }}"
            echo "-> Sincronizando Cargo.toml para a versao: $CANONICAL_VERSION"
            sed -i "0,/^version = .*/s//version = \"${CANONICAL_VERSION}\"/" Cargo.toml
            echo "-> Publicando urupema no registry gambi..."
            cargo publish --registry gambi --allow-dirty || echo "::warning::Versao ja publicada ou falha tolerada no registry."
          else
            echo "GAMBI_2LP_IN_TOKEN not set, skipping crate publish."
          fi

      - name: "Notify Kombinat Daemon of Release Cascade"
        run: |
          VERSION="${{ steps.versioning.outputs.canonical_tag }}"
          if [ -z "$VERSION" ]; then
            VERSION=$(head -n 1 VERSION | cut -d'+' -f1 | tr -d ' \r\n')
          else
            VERSION=$(echo "$VERSION" | cut -d'+' -f1 | tr -d ' \r\n')
          fi
          echo "★ Notificando Kombinat da publicação de urupema@${VERSION}..."
          curl -s -X POST http://127.0.0.1:4040/api/cascade/dispatch \
            -H "Content-Type: application/json" \
            -d "{\"package\": \"urupema\", \"version\": \"${VERSION}\"}" || curl -s -X POST http://172.17.0.1:4040/api/cascade/dispatch \
            -H "Content-Type: application/json" \
            -d "{\"package\": \"urupema\", \"version\": \"${VERSION}\"}" || {
            echo "::warning::Falha ao contatar Kombinat daemon em 127.0.0.1:4040 ou 172.17.0.1:4040. Continuando sem abortar CI."
          }

      - name: "Build Release Binary"
        run: cargo build --release --bin urupema

      - name: "Delete Generic Releases and Tags"
        env:
          GAMBI_TOKEN: ${{ secrets.GAMBI_2LP_IN_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -c '
          import os, sys, json, urllib.request

          api_url = os.environ.get("GITHUB_API_URL") or "https://gambi.2lp.in/api/v1"
          repo = os.environ.get("GITHUB_REPOSITORY") or "lumen/urupema"
          token = os.environ.get("GAMBI_TOKEN") or os.environ.get("GITHUB_TOKEN") or ""

          headers = {"User-Agent": "urupema-ci"}
          if token:
              headers["Authorization"] = f"token {token}"

          generic_tags = [
              "${{ steps.versioning.outputs.named_generic_tag }}",
              "${{ steps.versioning.outputs.primary_generic_tag }}",
          ]

          for tag in generic_tags:
              print(f"-> Verificando release e tag generica: {tag}")
              url = f"{api_url}/repos/{repo}/releases/tags/{tag}"
              req = urllib.request.Request(url, headers=headers)
              rel_id = None
              try:
                  with urllib.request.urlopen(req) as resp:
                      rel = json.load(resp)
                      rel_id = rel.get("id")
              except Exception as e:
                  print(f"   Nenhuma release existente para {tag}: {e}")

              if rel_id:
                  del_url = f"{api_url}/repos/{repo}/releases/{rel_id}"
                  del_req = urllib.request.Request(del_url, headers=headers, method="DELETE")
                  try:
                      with urllib.request.urlopen(del_req) as del_resp:
                          print(f"   Release generica {tag} (id: {rel_id}) deletada: {del_resp.status}")
                  except Exception as e:
                      print(f"::warning::Falha ao deletar release {rel_id}: {e}")

              # Deletar a tag git correspondente
              del_tag_url = f"{api_url}/repos/{repo}/tags/{tag}"
              del_tag_req = urllib.request.Request(del_tag_url, headers=headers, method="DELETE")
              try:
                  with urllib.request.urlopen(del_tag_req) as del_tag_resp:
                      print(f"   Tag generica {tag} deletada: {del_tag_resp.status}")
              except Exception as e:
                  print(f"   Tag remota {tag} inexistente ou erro: {e}")
          '

      - name: "Publish Canonical Release"
        uses: https://github.com/softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.canonical_tag }}
          name: "Urupema ${{ steps.versioning.outputs.canonical_tag }} (linux-x86_64)"
          prerelease: ${{ steps.versioning.outputs.is_dev == 'true' }}
          files: target/release/urupema
          body: |
            Binário oficial compilado para linux-x86_64.
            Versão Canônica: ${{ steps.versioning.outputs.canonical_tag }}
            Commit: ${{ github.sha }}

      - name: "Publish Named Generic Release"
        uses: https://github.com/softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.named_generic_tag }}
          name: "Urupema ${{ steps.versioning.outputs.named_generic_tag }} (linux-x86_64)"
          prerelease: ${{ steps.versioning.outputs.is_dev == 'true' }}
          files: target/release/urupema
          body: |
            Binário oficial compilado para linux-x86_64 (${{ steps.versioning.outputs.named_generic_tag }}).
            Versão Canônica: ${{ steps.versioning.outputs.canonical_tag }}
            Commit: ${{ github.sha }}

      - name: "Publish Primary Generic Release"
        uses: https://github.com/softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.primary_generic_tag }}
          name: "Urupema ${{ steps.versioning.outputs.primary_generic_tag }} (linux-x86_64)"
          prerelease: ${{ steps.versioning.outputs.is_dev == 'true' }}
          files: target/release/urupema
          body: |
            Binário oficial compilado para linux-x86_64 (${{ steps.versioning.outputs.primary_generic_tag }}).
            Versão Canônica: ${{ steps.versioning.outputs.canonical_tag }}
            Commit: ${{ github.sha }}

