name: "CI / CD Pipeline"

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  test:
    name: "Rust Test & Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "Install Rust Toolchain"
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: "Format Check"
        run: cargo fmt -- --check
      - name: "Clippy (Zero Warnings)"
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: "Run Tests"
        run: cargo test --all-targets --all-features

  deploy-site:
    name: "Deploy Documentation Site"
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: "Deploy to Cloudflare Workers"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            npx wrangler deploy
          else
            echo "CLOUDFLARE_API_TOKEN not set, skipping Cloudflare deploy."
          fi
      - name: "Deploy to Codeberg Pages (Fallback)"
        uses: https://codeberg.org/actions/pages@v1
        with:
          path: site

  release:
    name: "Release Linux x86_64 Binary"
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - name: "Install Rust Toolchain"
        uses: dtolnay/rust-toolchain@stable
      - name: "Build Release Binary"
        run: cargo build --release --bin urupema
      - name: "Publish Sovereign Release (latest)"
        uses: https://github.com/softprops/action-gh-release@v2
        with:
          tag_name: "latest"
          name: "Urupema Latest (linux-x86_64)"
          prerelease: false
          files: target/release/urupema
          body: |
            Binário soberano oficial compilado para linux-x86_64.
            Commit: ${{ github.sha }}

